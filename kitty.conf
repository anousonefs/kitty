shell /usr/local/bin/fish

# Font
font_family MesloLGS NF
# italic_font auto
# bold_italic_font auto
font_size 14.0

shell_integration enabled
allow_hyperlinks yes
editor nvim

# Use an explicit shortcut table so macOS/kitty defaults do not steal tmux keys.
clear_all_shortcuts yes

# Theme
foreground #f8f8f2
background #000000
url_color #d65c9d

window_border_width 0.5pt
window_resize_step_cells 2
window_resize_step_lines 2
initial_window_width 640
initial_window_height 400
draw_minimal_borders yes
inactive_text_alpha 0.7
macos_titlebar_color background
macos_thicken_font 0.05
active_border_color none

# default layout is vertical splits only
enabled_layouts splits
enable_audio_bell no

# Cursor
cursor #8fee96

# Kitty exposes its full keyboard/color protocol to tmux; tmux switches panes to tmux-256color.
term xterm-kitty
background_opacity 0.85 

color0  #000000
color8  #44475a

color1  #ff5555
color9  #ff5555

color2  #50fa7b
color10 #50fa7b

color3  #f1fa8c
color11 #f1fa8c

color4  #bd93f9
color12 #bd93f9

color5  #ff79c6
color13 #ff79c6

color6  #8be9fd
color14 #8be9fd

color7  #bbbbbb
color15 #ffffff

hide_window_decorations titlebar-only
copy_on_select yes

# tmux
map cmd+a send_text all \x01
map cmd+t send_text all \x01c
map cmd+y send_text all \x01y
map cmd+s send_text all \x01s
map cmd+z send_text all \x01z
map cmd+w send_text all \x01x
map cmd+shift+n send_text all \x01%
map cmd+shift+m send_text all \x01"
map cmd+shift+comma send_text all \x01$
map cmd+comma send_text all \x01,
map cmd+d send_text all \x01d
map cmd+n send_text all \x01n
map cmd+p send_text all \x01p

map cmd+1 send_text all \x011
map cmd+2 send_text all \x012
map cmd+3 send_text all \x013
map cmd+4 send_text all \x014
map cmd+5 send_text all \x015
map cmd+6 send_text all \x016
map cmd+7 send_text all \x017
map cmd+8 send_text all \x018
map cmd+9 send_text all \x019

# vim
map cmd+m send_text application \u0019

map cmd+h send_key ctrl+h
map cmd+j send_key ctrl+j
map cmd+k send_key ctrl+k
map cmd+l send_key ctrl+l


map cmd+r send_text all \x12

map cmd+o send_text all \x0f
map cmd+u send_text all \x15
map cmd+i send_text all \x09 

map cmd+e send_key ctrl+e
map cmd+g send_key ctrl+g


map cmd+f send_key ctrl+f

map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard 

map cmd+shift+r load_config_file

map cmd+x send_text all \x01\x54

# tmux resize shortcuts using the C-a prefix configured in ~/.config/tmux/tmux.conf.
map cmd+shift+h send_text all \x01H
map cmd+shift+j send_text all \x01J
map cmd+shift+k send_text all \x01K
map cmd+shift+l send_text all \x01L
