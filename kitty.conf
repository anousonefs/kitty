shell /usr/local/bin/fish

# Font
font_family MesloLGS NF
# italic_font auto
# bold_italic_font auto
font_size 14.0

shell_integration enabled
allow_hyperlinks yes
editor nvim

# Use an explicit shortcut table so macOS/kitty defaults do not steal tmux keys.
clear_all_shortcuts yes

# Theme
foreground #f8f8f2
background #000000
url_color #d65c9d

window_border_width 0.5pt
window_resize_step_cells 2
window_resize_step_lines 2
initial_window_width 640
initial_window_height 400
draw_minimal_borders yes
inactive_text_alpha 0.7
macos_titlebar_color background
macos_thicken_font 0.05
active_border_color none

# default layout is vertical splits only
enabled_layouts splits
enable_audio_bell no

# Cursor
cursor #8fee96

# Kitty exposes its full keyboard/color protocol to tmux; tmux switches panes to tmux-256color.
term xterm-kitty
background_opacity 0.85 

color0  #000000
color8  #44475a

color1  #ff5555
color9  #ff5555

color2  #50fa7b
color10 #50fa7b

color3  #f1fa8c
color11 #f1fa8c

color4  #bd93f9
color12 #bd93f9

color5  #ff79c6
color13 #ff79c6

color6  #8be9fd
color14 #8be9fd

color7  #bbbbbb
color15 #ffffff

hide_window_decorations titlebar-only
copy_on_select yes

# tmux
map --allow-fallback=shifted,ascii cmd+a send_text all \x01
map --allow-fallback=shifted,ascii cmd+t send_text all \x01c
map --allow-fallback=shifted,ascii cmd+y send_text all \x01y
map --allow-fallback=shifted,ascii cmd+s send_text all \x01s
map --allow-fallback=shifted,ascii cmd+z send_text all \x01z
map --allow-fallback=shifted,ascii cmd+w send_text all \x01x
map --allow-fallback=shifted,ascii cmd+shift+n send_text all \x01%
map --allow-fallback=shifted,ascii cmd+shift+m send_text all \x01"
map --allow-fallback=shifted,ascii cmd+shift+comma send_text all \x01$
map --allow-fallback=shifted,ascii cmd+comma send_text all \x01,
map --allow-fallback=shifted,ascii cmd+d send_text all \x04
map --allow-fallback=shifted,ascii cmd+n send_text all \x01n
map --allow-fallback=shifted,ascii cmd+p send_text all \x01p

map --allow-fallback=shifted,ascii cmd+1 send_text all \x011
map --allow-fallback=shifted,ascii cmd+2 send_text all \x012
map --allow-fallback=shifted,ascii cmd+3 send_text all \x013
map --allow-fallback=shifted,ascii cmd+4 send_text all \x014
map --allow-fallback=shifted,ascii cmd+5 send_text all \x015
map --allow-fallback=shifted,ascii cmd+6 send_text all \x016
map --allow-fallback=shifted,ascii cmd+7 send_text all \x017
map --allow-fallback=shifted,ascii cmd+8 send_text all \x018
map --allow-fallback=shifted,ascii cmd+9 send_text all \x019

# vim
map --allow-fallback=shifted,ascii cmd+m send_text application \u0019

map --allow-fallback=shifted,ascii cmd+h send_key ctrl+h
map --allow-fallback=shifted,ascii cmd+j send_key ctrl+j
map --allow-fallback=shifted,ascii cmd+k send_key ctrl+k
map --allow-fallback=shifted,ascii cmd+l send_key ctrl+l


map --allow-fallback=shifted,ascii cmd+r send_text all \x12

map --allow-fallback=shifted,ascii cmd+o send_text all \x0f
map --allow-fallback=shifted,ascii cmd+u send_text all \x15
map --allow-fallback=shifted,ascii cmd+i send_text all \x09 

map --allow-fallback=shifted,ascii cmd+e send_key ctrl+e
map --allow-fallback=shifted,ascii cmd+g send_key ctrl+g


map --allow-fallback=shifted,ascii cmd+f send_text all \x06

map --allow-fallback=shifted,ascii cmd+c copy_to_clipboard
map --allow-fallback=shifted,ascii cmd+v paste_from_clipboard 

map --allow-fallback=shifted,ascii cmd+shift+r load_config_file
map ctrl+shift+f5 load_config_file

map --allow-fallback=shifted,ascii cmd+x send_text all \x01\x54

# tmux resize shortcuts using the C-a prefix configured in ~/.config/tmux/tmux.conf.
map --allow-fallback=shifted,ascii cmd+shift+h send_text all \x01H
map --allow-fallback=shifted,ascii cmd+shift+j send_text all \x01J
map --allow-fallback=shifted,ascii cmd+shift+k send_text all \x01K
map --allow-fallback=shifted,ascii cmd+shift+l send_text all \x01L
